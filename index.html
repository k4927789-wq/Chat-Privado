<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mando Web Multi-Dispositivo</title>
  <!-- Librería PeerJS para conectar 2 celulares por WebRTC sin servidor -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #0a0b0e;
      --card-bg: #161b22;
      --accent: #00f2fe;
      --btn-bg: #21262d;
      --btn-border: #30363d;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* PANTALLA DE SELECCIÓN DE MODO */
    .mode-selector {
      background: var(--card-bg);
      border: 2px solid var(--btn-border);
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mode-selector h2 {
      color: var(--accent);
      font-size: 1.3rem;
    }

    .input-code {
      background: #0d1117;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      width: 100%;
    }

    .btn-main {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-main:active { opacity: 0.8; }

    /* MANDO PRO */
    .gamepad-body {
      display: none; /* Oculto hasta conectar */
      background: linear-gradient(145deg, #1c2128, #0d1117);
      border: 3px solid #30363d;
      border-radius: 40px;
      padding: 20px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .gamepad-body { grid-template-columns: 1.2fr 1.4fr 1.2fr; }
    }

    .pad-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 15px;
    }

    .touchpad-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }

    .touchpad {
      width: 100%;
      height: 140px;
      background: radial-gradient(circle, #161b22 0%, #0d1117 100%);
      border: 2px solid var(--accent);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b949e;
      font-size: 0.85rem;
      text-align: center;
      touch-action: none;
      cursor: crosshair;
    }

    .mouse-btns { display: flex; gap: 10px; width: 100%; }

    .btn-mouse {
      flex: 1; padding: 10px; background: var(--btn-bg);
      border: 1px solid var(--btn-border); color: #fff;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }

    .menu-row { display: flex; gap: 8px; width: 100%; justify-content: center; }

    .btn-menu {
      background: #21262d; border: 1px solid #30363d;
      color: #fff; padding: 8px 12px; border-radius: 12px;
      font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }

    .dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }

    .btn-ctrl {
      background: var(--btn-bg); border: 2px solid var(--btn-border);
      color: var(--text); border-radius: 12px; font-weight: bold;
      font-size: 1.3rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 4px 0 #0d1117;
    }

    .btn-ctrl:active {
      transform: translateY(2px); box-shadow: 0 2px 0 #0d1117;
      background: var(--accent); color: #000;
    }

    .joystick-outer {
      width: 120px; height: 120px;
      background: radial-gradient(circle, #21262d 0%, #0d1117 100%);
      border: 3px solid var(--btn-border); border-radius: 50%;
      position: relative; display: flex; align-items: center;
      justify-content: center; touch-action: none;
    }

    .joystick-stick {
      width: 55px; height: 55px;
      background: radial-gradient(circle, #30363d 0%, #161b22 100%);
      border: 2px solid var(--accent); border-radius: 50%;
      position: absolute; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .action-btns { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
    .btn-act { border-radius: 50%; font-size: 1.1rem; }
    .btn-a { background: #238636; border-color: #2ea043; }
    .btn-b { background: #da3633; border-color: #f85149; }
    .btn-x { background: #1f6feb; border-color: #388bfd; }
    .btn-y { background: #d29922; border-color: #e3b341; color: #fff; }

    /* CONSOLA DE RECEPTION EN PANTALLA RECEPTORA */
    .receiver-box {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .console-log {
      margin-top: 15px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 10px;
      padding: 10px; height: 150px; overflow-y: auto;
      font-family: monospace; font-size: 0.8rem; color: var(--accent);
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO (ELEGIR ROL) -->
  <div class="mode-selector" id="setupScreen">
    <h2>🎮 Mando Web Conexión</h2>
    <p style="font-size: 0.85rem; color: #8b949e;">Elige la función de este celular:</p>

    <button class="btn-main" style="background:#21262d; color:#fff;" id="btnHostMode">📱 Celular 1: RECIBIR (Pantalla/Juego)</button>

    <hr style="border-color: #30363d; margin: 5px 0;">

    <p style="font-size: 0.85rem; color: #8b949e;">O ingresar código para ser el Mando:</p>
    <input type="text" class="input-code" id="joinCodeInput" placeholder="CÓDIGO (Ej: 4821)" maxlength="6">
    <button class="btn-main" id="btnJoinMode">🕹️ Celular 2: UNIRSE COMO MANDO</button>
  </div>

  <!-- MODO RECEPCTOR (CELULAR 1) -->
  <div class="receiver-box" id="receiverScreen">
    <h3 style="color: var(--accent);">Código de Sala:</h3>
    <h1 id="roomCodeDisplay" style="font-size: 2.5rem; letter-spacing: 4px; margin: 10px 0;">----</h1>
    <p style="font-size: 0.85rem; color: #8b949e;">Ingresa este código en el otro celular para conectarlo como mando.</p>
    <div class="console-log" id="receiverLog">> Esperando que el mando se conecte...</div>
  </div>

  <!-- MODO MANDO (CELULAR 2) -->
  <div class="gamepad-body" id="gamepadScreen">

    <!-- IZQUIERDA: PERILLA Y CRUCETA -->
    <div class="pad-column">
      <div class="joystick-outer" id="joystickLeft">
        <div class="joystick-stick" id="stickLeft"></div>
      </div>

      <div class="dpad">
        <div></div>
        <button class="btn-ctrl" data-cmd="UP">▲</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="LEFT">◄</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="RIGHT">►</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="DOWN">▼</button>
        <div></div>
      </div>
    </div>

    <!-- CENTRO: MOUSE Y MENÚS -->
    <div class="pad-column">
      <div class="touchpad-box">
        <div class="touchpad" id="touchpad">
          🖱️ Mouse Touchpad<br><small>Desliza tu dedo aquí</small>
        </div>
        <div class="mouse-btns">
          <button class="btn-mouse" data-cmd="CLICK_LEFT">Clic Izq.</button>
          <button class="btn-mouse" data-cmd="CLICK_RIGHT">Clic Der.</button>
        </div>
      </div>

      <div class="menu-row">
        <button class="btn-menu" data-cmd="SELECT">SELECT</button>
        <button class="btn-menu" data-cmd="HOME">🏠 HOME</button>
        <button class="btn-menu" data-cmd="MENU">☰ MENÚ</button>
        <button class="btn-menu" data-cmd="START">START</button>
      </div>
    </div>

    <!-- DERECHA: BOTONES DE ACCIÓN -->
    <div class="pad-column">
      <div class="action-btns">
        <div></div>
        <button class="btn-ctrl btn-act btn-y" data-cmd="Y">Y</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-x" data-cmd="X">X</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-b" data-cmd="B">B</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-a" data-cmd="A">A</button>
        <div></div>
      </div>
    </div>

  </div>

  <script>
    let peer = null;
    let conn = null;

    const setupScreen = document.getElementById('setupScreen');
    const receiverScreen = document.getElementById('receiverScreen');
    const gamepadScreen = document.getElementById('gamepadScreen');

    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const receiverLog = document.getElementById('receiverLog');
    const joinCodeInput = document.getElementById('joinCodeInput');

    // Generador de código aleatorio corto de 4 números
    function generateShortId() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // --- OPCIÓN 1: SER LA PANTALLA RECEPTORA (CELULAR 1) ---
    document.getElementById('btnHostMode').addEventListener('click', () => {
      const roomCode = generateShortId();
      peer = new Peer(`mando-room-${roomCode}`);

      setupScreen.style.display = 'none';
      receiverScreen.style.display = 'block';
      roomCodeDisplay.innerText = roomCode;

      peer.on('open', (id) => {
        receiverLog.innerHTML += `<br>> Sala creada con éxito. ID: ${roomCode}`;
      });

      peer.on('connection', (connection) => {
        conn = connection;
        receiverLog.innerHTML += `<br><b>> ¡MANDO CONECTADO Y LISTO!</b>`;

        conn.on('data', (data) => {
          // Aquí recibes todos los eventos transmitidos desde el mando
          receiverLog.innerHTML += `<br>> Recibido: ${JSON.stringify(data)}`;
          receiverLog.scrollTop = receiverLog.scrollHeight;
        });
      });
    });

    // --- OPCIÓN 2: SER EL MANDO (CELULAR 2) ---
    document.getElementById('btnJoinMode').addEventListener('click', () => {
      const code = joinCodeInput.value.trim();
      if (!code || code.length < 4) {
        alert("Ingresa el código numérico de 4 dígitos generado en la otra pantalla.");
        return;
      }

      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(`mando-room-${code}`);

        conn.on('open', () => {
          setupScreen.style.display = 'none';
          gamepadScreen.style.display = 'grid';
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        });

        conn.on('error', (err) => {
          alert("No se pudo conectar a ese código. Revisa que la otra pantalla siga abierta.");
        });
      });
    });

    // FUNCIÓN PARA TRANSMITIR DATOS AL CELULAR 1
    function sendSignal(type, data) {
      if (conn && conn.open) {
        conn.send({ type, ...data });
      }
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // --- EVENTOS DEL MANDO (BOTONES, TOUCHPAD, JOYSTICK) ---
    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('pointerdown', () => {
        sendSignal('BTN_PRESS', { key: btn.getAttribute('data-cmd') });
      });
    });

    // TOUCHPAD MOUSE
    const touchpad = document.getElementById('touchpad');
    let startX = 0, startY = 0, isTouching = false;

    touchpad.addEventListener('pointerdown', (e) => {
      isTouching = true;
      startX = e.clientX;
      startY = e.clientY;
      touchpad.setPointerCapture(e.pointerId);
    });

    touchpad.addEventListener('pointermove', (e) => {
      if (!isTouching) return;
      const dx = Math.round(e.clientX - startX);
      const dy = Math.round(e.clientY - startY);

      if (dx !== 0 || dy !== 0) {
        sendSignal('MOUSE_MOVE', { dx, dy });
        startX = e.clientX;
        startY = e.clientY;
      }
    });

    touchpad.addEventListener('pointerup', (e) => {
      isTouching = false;
      touchpad.releasePointerCapture(e.pointerId);
    });

    // PERILLA ANALÓGICA
    const joystick = document.getElementById('joystickLeft');
    const stick = document.getElementById('stickLeft');
    let joyActive = false;
    const maxRadius = 30;

    joystick.addEventListener('pointerdown', (e) => {
      joyActive = true;
      joystick.setPointerCapture(e.pointerId);
      updateJoystick(e);
    });

    joystick.addEventListener('pointermove', (e) => {
      if (joyActive) updateJoystick(e);
    });

    function resetJoystick() {
      if (!joyActive) return;
      joyActive = false;
      stick.style.transform = `translate(0px, 0px)`;
      sendSignal('JOYSTICK_MOVE', { x: 0, y: 0 });
    }

    joystick.addEventListener('pointerup', resetJoystick);
    joystick.addEventListener('pointercancel', resetJoystick);

    function updateJoystick(e) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = e.clientX - centerX;
      let dy = e.clientY - centerY;
      const dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        const angle = Math.atan2(dy, dx);
        dx = Math.cos(angle) * maxRadius;
        dy = Math.sin(angle) * maxRadius;
      }

      stick.style.transform = `translate(${dx}px, ${dy}px)`;
      sendSignal('JOYSTICK_MOVE', { 
        x: parseFloat((dx / maxRadius).toFixed(2)), 
        y: parseFloat((dy / maxRadius).toFixed(2)) 
      });
    }
  </script>
</body>
</html>
