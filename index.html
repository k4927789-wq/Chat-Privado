<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Chat PeerJS - Estilo WhatsApp</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app-container {
      width: 90%;
      max-width: 900px;
      height: 90vh;
      display: flex;
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    /* Panel lateral de contactos */
    .sidebar {
      width: 35%;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      background-color: #181818;
    }
    .profile-header {
      padding: 15px;
      background-color: #252525;
      border-bottom: 1px solid #333;
    }
    .profile-header h3 {
      font-size: 14px;
      color: #888;
    }
    .profile-header p {
      font-size: 18px;
      font-weight: bold;
      color: #a855f7;
    }
    .contacts-list {
      flex: 1;
      overflow-y: auto;
    }
    .contact-item {
      padding: 15px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      transition: background 0.2s;
    }
    .contact-item:hover, .contact-item.active {
      background-color: #2a2a2a;
    }
    .contact-item .name {
      font-weight: bold;
      color: #fff;
    }
    .contact-item .sub {
      font-size: 12px;
      color: #888;
    }
    /* Panel del Chat */
    .chat-area {
      width: 65%;
      display: flex;
      flex-direction: column;
      background-color: #121212;
    }
    .chat-header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      font-weight: bold;
    }
    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      word-wrap: break-word;
    }
    .message.sent {
      align-self: flex-end;
      background-color: #7e22ce;
      color: #fff;
    }
    .message.received {
      align-self: flex-start;
      background-color: #2a2a2a;
      color: #e0e0e0;
    }
    /* Formulario inferior */
    .input-area {
      padding: 15px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background-color: #121212;
      color: #fff;
      outline: none;
    }
    .input-area input[type="text"] { flex: 1; }
    .input-area button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #a855f7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:hover { background-color: #9333ea; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Panel Izquierdo: Tu ID y Contactos -->
    <div class="sidebar">
      <div class="profile-header">
        <h3>MI NÚMERO VIRTUAL:</h3>
        <p id="my-number">Cargando...</p>
      </div>
      <div class="contacts-list" id="contacts-list">
        <!-- Lista dinámica de contactos -->
      </div>
    </div>

    <!-- Panel Derecho: Conversación -->
    <div class="chat-area">
      <div class="chat-header" id="chat-header">
        Selecciona o ingresa un número para chatear
      </div>
      <div class="messages-box" id="messages-box">
        <!-- Mensajes dinámicos -->
      </div>
      <div class="input-area">
        <input type="number" id="target-number" placeholder="Número destino..." style="width: 130px;">
        <input type="text" id="message-text" placeholder="Escribe un mensaje...">
        <button id="send-btn">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURACIÓN DE IDENTIDAD PERSISTENTE ---
    let myNumber = localStorage.getItem('my_virtual_number');
    if (!myNumber) {
      // Genera un número aleatorio de 6 dígitos si es la primera vez
      myNumber = Math.floor(100000 + Math.random() * 900000).toString();
      localStorage.setItem('my_virtual_number', myNumber);
    }
    document.getElementById('my-number').textContent = myNumber;

    // Inicializar PeerJS con el ID fijo guardado
    const peer = new Peer(myNumber);
    let activeConnections = {};
    let activeChatNumber = null;

    peer.on('open', (id) => {
      console.log('Conectado a la red PeerJS con el número:', id);
    });

    // --- 2. MANEJO DE CONTACTOS Y MENSAJES EN LOCALSTORAGE ---
    function getContacts() {
      return JSON.parse(localStorage.getItem('chat_contacts')) || [];
    }

    function saveContactAuto(number) {
      let contacts = getContacts();
      const exists = contacts.some(c => c.number === number);
      if (!exists) {
        contacts.push({ number: number, name: `Contacto ${number}` });
        localStorage.setItem('chat_contacts', JSON.stringify(contacts));
        renderContactsList();
      }
    }

    function getHistory(number) {
      const chats = JSON.parse(localStorage.getItem('chat_history')) || {};
      return chats[number] || [];
    }

    function saveMessageHistory(targetNumber, messageObj) {
      let chats = JSON.parse(localStorage.getItem('chat_history')) || {};
      if (!chats[targetNumber]) {
        chats[targetNumber] = [];
      }
      chats[targetNumber].push(messageObj);
      localStorage.setItem('chat_history', JSON.stringify(chats));
    }

    // --- 3. MANEJO DE LA INTERFAZ (UI) ---
    function renderContactsList() {
      const listContainer = document.getElementById('contacts-list');
      listContainer.innerHTML = '';
      const contacts = getContacts();

      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = `contact-item ${activeChatNumber === c.number ? 'active' : ''}`;
        item.innerHTML = `
          <div class="name">${c.name}</div>
          <div class="sub">Nº ${c.number}</div>
        `;
        item.onclick = () => selectContact(c.number);
        listContainer.appendChild(item);
      });
    }

    function selectContact(number) {
      activeChatNumber = number;
      document.getElementById('target-number').value = number;
      document.getElementById('chat-header').textContent = `Chat con ${number}`;
      renderContactsList();
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('messages-box');
      box.innerHTML = '';

      if (!activeChatNumber) return;

      const history = getHistory(activeChatNumber);
      history.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.sender === 'me' ? 'sent' : 'received'}`;
        msgDiv.textContent = msg.text;
        box.appendChild(msgDiv);
      });
      box.scrollTop = box.scrollHeight;
    }

    // --- 4. RECEPCIÓN DE CONEXIONES Y MENSAJES ENTRANTES ---
    peer.on('connection', (conn) => {
      const senderNumber = conn.peer;
      
      // Auto-guardar el contacto que se acaba de conectar
      saveContactAuto(senderNumber);

      // Guardar referencia de conexión activa
      activeConnections[senderNumber] = conn;

      conn.on('data', (data) => {
        // Guardar mensaje recibido en historial local
        saveMessageHistory(senderNumber, { sender: senderNumber, text: data.text });

        // Si el chat abierto es el de esa persona, refrescar mensajes
        if (activeChatNumber === senderNumber) {
          renderMessages();
        }
      });
    });

    // --- 5. ENVÍO DE MENSAJES ---
    document.getElementById('send-btn').onclick = () => {
      const targetInput = document.getElementById('target-number');
      const messageInput = document.getElementById('message-text');

      const targetNumber = targetInput.value.trim();
      const text = messageInput.value.trim();

      if (!targetNumber || !text) return;

      // Descartar si intenta enviarse un mensaje a sí mismo
      if (targetNumber === myNumber) {
        alert("No puedes enviarte mensajes a tu propio número.");
        return;
      }

      // Auto-guardar el número en la lista de contactos
      saveContactAuto(targetNumber);
      selectContact(targetNumber);

      // Guardar el mensaje localmente
      const msgObj = { sender: 'me', text: text };
      saveMessageHistory(targetNumber, msgObj);
      renderMessages();

      messageInput.value = '';

      // Verificar si ya existe una conexión Peer activa
      if (activeConnections[targetNumber] && activeConnections[targetNumber].open) {
        activeConnections[targetNumber].send({ text: text });
      } else {
        // Establecer nueva conexión
        const conn = peer.connect(targetNumber);

        conn.on('open', () => {
          activeConnections[targetNumber] = conn;
          conn.send({ text: text });
        });

        conn.on('error', (err) => {
          console.error("No se pudo enviar el mensaje:", err);
          alert("No se pudo conectar con el usuario. Es posible que esté fuera de línea.");
        });
      }
    };

    // Cargar la interfaz inicial al abrir la página
    renderContactsList();
  </script>
</body>
</html>
