<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mando Bluetooth Pro + Joystick</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent: #66fcf1;
      --accent-glow: rgba(102, 252, 241, 0.4);
      --btn-bg: #2d3748;
      --btn-border: #4a5568;
      --text: #ffffff;
      --subtext: #c5c6c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* BARRA DE CONFIGURACIÓN Y ESTADO */
    .top-bar {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: #121821;
      border: 1px solid #2d3748;
      padding: 12px 18px;
      border-radius: 16px;
      margin-bottom: 15px;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 260px;
    }

    .config-group input {
      background: #0b0c10;
      border: 1px solid var(--btn-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      flex: 1;
      font-size: 0.9rem;
      outline: none;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1f2833;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #2d3748;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff5252;
    }

    .status-dot.online {
      background-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .btn-action {
      background: #45f3c4;
      color: #0b0c10;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    /* ESTRUCTURA PRINCIPAL DEL MANDO */
    .gamepad-body {
      background: linear-gradient(145deg, #18202a, #0f141c);
      border: 3px solid #2d3748;
      border-radius: 50px;
      padding: 25px 20px;
      width: 100%;
      max-width: 950px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .gamepad-body {
        grid-template-columns: 1.2fr 1.5fr 1.2fr;
      }
    }

    /* COLUMNAS DEL MANDO */
    .pad-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
    }

    /* TOUCHPAD / RATÓN CENTRAL */
    .touchpad-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .touchpad {
      width: 100%;
      height: 160px;
      background: radial-gradient(circle, #121821 0%, #0b0c10 100%);
      border: 2px solid var(--accent);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext);
      font-size: 0.85rem;
      text-align: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(102, 252, 241, 0.15);
      touch-action: none;
      cursor: crosshair;
    }

    .mouse-click-btns {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-mouse {
      flex: 1;
      padding: 12px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #fff;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTONES DE MENÚ Y NAVEGACIÓN */
    .menu-buttons-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      margin-top: 5px;
    }

    .btn-system {
      background: #1a232e;
      border: 1px solid #3b4859;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn-system:active {
      background: var(--accent);
      color: #000;
    }

    /* CRUCETA (D-PAD) AUMENTADA */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(3, 65px);
      gap: 6px;
    }

    .btn-ctrl {
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      color: var(--text);
      border-radius: 14px;
      font-weight: bold;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #121821;
    }

    .btn-ctrl:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #121821;
      background: var(--accent);
      color: #000;
    }

    /* PERILLA (JOYSTICK ANALÓGICO) */
    .joystick-outer {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #222c37 0%, #0d1117 100%);
      border: 3px solid #3b4859;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 5px 10px rgba(0,0,0,0.7);
      touch-action: none;
    }

    .joystick-stick {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #4a5568 0%, #1a202c 100%);
      border: 2px solid var(--accent);
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      transition: transform 0.05s ease-out;
    }

    /* BOTONES DE ACCIÓN (A, B, X, Y) AUMENTADOS */
    .action-btns {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(3, 65px);
      gap: 6px;
    }

    .btn-act {
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .btn-a { background: #38a169; border-color: #2f855a; }
    .btn-b { background: #e53e3e; border-color: #c53030; }
    .btn-x { background: #3182ce; border-color: #2b6cb0; }
    .btn-y { background: #d69e2e; border-color: #b7791f; color: #fff; }

    /* LOGS CONSOLA */
    .console-log {
      margin-top: 15px;
      background: #080a0d;
      border: 1px solid #1f2833;
      border-radius: 12px;
      padding: 10px;
      width: 100%;
      max-width: 950px;
      height: 70px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      color: #718096;
    }
  </style>
</head>
<body>

  <!-- BARRA DE CONFIGURACIÓN -->
  <div class="top-bar">
    <div class="config-group">
      <input type="text" id="controllerName" value="Mando-GamePad-Pro" placeholder="Nombre del Mando">
      <button class="btn-action" id="saveNameBtn">Guardar</button>
    </div>

    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="deviceIcon">📱</span>
      <span id="statusText">Desconectado</span>
    </div>

    <button class="btn-action" id="connectBt">Sincronizar Bluetooth</button>
  </div>

  <!-- CUERPO DEL MANDO -->
  <div class="gamepad-body">

    <!-- IZQUIERDA: JOYSTICK + CRUCETA -->
    <div class="pad-column">
      <!-- PERILLA / JOYSTICK ANALÓGICO -->
      <div class="joystick-outer" id="joystickLeft">
        <div class="joystick-stick" id="stickLeft"></div>
      </div>

      <!-- CRUCETA MÁS GRANDE -->
      <div class="dpad">
        <div></div>
        <button class="btn-ctrl" data-cmd="UP">▲</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="LEFT">◄</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="RIGHT">►</button>
        <div></div>
        <button class="btn-ctrl" data-cmd="DOWN">▼</button>
        <div></div>
      </div>
    </div>

    <!-- CENTRO: RATÓN TOUCHPAD + BOTONES MENÚ -->
    <div class="pad-column">
      <div class="touchpad-container">
        <div class="touchpad" id="touchpad">
          <span>🖱️ Mouse Touchpad<br><small>Desliza tu dedo aquí</small></span>
        </div>
        <div class="mouse-click-btns">
          <button class="btn-mouse" data-cmd="CLICK_LEFT">Clic Izq.</button>
          <button class="btn-mouse" data-cmd="CLICK_RIGHT">Clic Der.</button>
        </div>
      </div>

      <!-- BOTONES DE MENÚ ABAJO DEL RATÓN -->
      <div class="menu-buttons-row">
        <button class="btn-system" data-cmd="SELECT">SELECT</button>
        <button class="btn-system" data-cmd="HOME">🏠 HOME</button>
        <button class="btn-system" data-cmd="MENU">☰ MENÚ</button>
        <button class="btn-system" data-cmd="START">START</button>
      </div>
    </div>

    <!-- DERECHA: BOTONES DE ACCIÓN (A,B,X,Y) -->
    <div class="pad-column">
      <div class="action-btns">
        <div></div>
        <button class="btn-ctrl btn-act btn-y" data-cmd="Y">Y</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-x" data-cmd="X">X</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-b" data-cmd="B">B</button>
        <div></div>
        <button class="btn-ctrl btn-act btn-a" data-cmd="A">A</button>
        <div></div>
      </div>
    </div>

  </div>

  <div class="console-log" id="logBox">
    > Mando iniciado. Esperando conexión...
  </div>

  <script>
    let btDevice;
    const connectBt = document.getElementById('connectBt');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const deviceIcon = document.getElementById('deviceIcon');
    const logBox = document.getElementById('logBox');
    const touchpad = document.getElementById('touchpad');

    const controllerNameInput = document.getElementById('controllerName');
    const saveNameBtn = document.getElementById('saveNameBtn');

    // Cargar nombre
    if (localStorage.getItem('custom_pad_name')) {
      controllerNameInput.value = localStorage.getItem('custom_pad_name');
    }

    saveNameBtn.addEventListener('click', () => {
      localStorage.setItem('custom_pad_name', controllerNameInput.value);
      printLog(`Nombre cambiado a: "${controllerNameInput.value}"`);
    });

    function printLog(msg) {
      logBox.innerHTML += `<br>> ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function sendSignal(type, data) {
      const payload = JSON.stringify({
        sender: controllerNameInput.value,
        type: type,
        ...data
      });
      printLog(payload);

      if (navigator.vibrate) navigator.vibrate(20);
    }

    // --- BLUETOOTH ---
    connectBt.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert("Tu navegador no soporta Web Bluetooth API");
        return;
      }

      try {
        printLog("Buscando dispositivos...");
        btDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['generic_access', 'human_interface_device']
        });

        statusText.innerText = btDevice.name || "Conectado";
        statusDot.classList.add('online');
        await btDevice.gatt.connect();
        printLog(`¡Vinculado con ${btDevice.name}!`);
      } catch (err) {
        printLog(`Error: ${err.message}`);
      }
    });

    // --- BOTONES ESTÁNDAR Y SISTEMA ---
    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('pointerdown', () => {
        const cmd = btn.getAttribute('data-cmd');
        sendSignal('BTN_PRESS', { key: cmd });
      });
    });

    // --- MOUSE TOUCHPAD ---
    let startX = 0, startY = 0, isTouching = false;

    touchpad.addEventListener('pointerdown', (e) => {
      isTouching = true;
      startX = e.clientX;
      startY = e.clientY;
      touchpad.setPointerCapture(e.pointerId);
    });

    touchpad.addEventListener('pointermove', (e) => {
      if (!isTouching) return;
      const dx = Math.round(e.clientX - startX);
      const dy = Math.round(e.clientY - startY);

      if (dx !== 0 || dy !== 0) {
        sendSignal('MOUSE_MOVE', { dx, dy });
        startX = e.clientX;
        startY = e.clientY;
      }
    });

    touchpad.addEventListener('pointerup', (e) => {
      isTouching = false;
      touchpad.releasePointerCapture(e.pointerId);
    });

    // --- LÓGICA DE LA PERILLA / JOYSTICK ANALÓGICO ---
    const joystick = document.getElementById('joystickLeft');
    const stick = document.getElementById('stickLeft');
    let joyActive = false;
    const maxDistance = 35; // Límite del radio de la perilla en px

    joystick.addEventListener('pointerdown', (e) => {
      joyActive = true;
      joystick.setPointerCapture(e.pointerId);
      moveJoystick(e);
    });

    joystick.addEventListener('pointermove', (e) => {
      if (joyActive) moveJoystick(e);
    });

    function stopJoystick(e) {
      if (!joyActive) return;
      joyActive = false;
      stick.style.transform = `translate(0px, 0px)`;
      sendSignal('JOYSTICK_MOVE', { x: 0, y: 0 });
    }

    joystick.addEventListener('pointerup', stopJoystick);
    joystick.addEventListener('pointercancel', stopJoystick);

    function moveJoystick(e) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let deltaX = e.clientX - centerX;
      let deltaY = e.clientY - centerY;

      const distance = Math.hypot(deltaX, deltaY);

      if (distance > maxDistance) {
        const angle = Math.atan2(deltaY, deltaX);
        deltaX = Math.cos(angle) * maxDistance;
        deltaY = Math.sin(angle) * maxDistance;
      }

      stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

      // Normalizar valores entre -1 y 1 para los juegos
      const normalizedX = (deltaX / maxDistance).toFixed(2);
      const normalizedY = (deltaY / maxDistance).toFixed(2);

      sendSignal('JOYSTICK_MOVE', { x: parseFloat(normalizedX), y: parseFloat(normalizedY) });
    }
  </script>
</body>
</html>
