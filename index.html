<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Chat PeerJS - Estilo WhatsApp</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app-container {
      width: 95%;
      max-width: 1000px;
      height: 92vh;
      display: flex;
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    /* Panel lateral de contactos */
    .sidebar {
      width: 38%;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      background-color: #181818;
    }
    .profile-header {
      padding: 15px;
      background-color: #252525;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #333;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #aaa;
    }
    .profile-info {
      flex: 1;
      overflow: hidden;
    }
    .profile-info h3 {
      font-size: 13px;
      color: #888;
    }
    .profile-info p {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-info span {
      font-size: 12px;
      color: #a855f7;
    }
    .edit-profile-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 16px;
    }
    .edit-profile-btn:hover { color: #fff; }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
    }
    .contact-item {
      padding: 12px 15px;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .contact-item:hover, .contact-item.active {
      background-color: #2a2a2a;
    }
    .contact-details {
      flex: 1;
    }
    .contact-item .name {
      font-weight: bold;
      color: #fff;
      font-size: 14px;
    }
    .contact-item .sub {
      font-size: 12px;
      color: #888;
    }
    .edit-contact-btn {
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 14px;
      padding: 5px;
    }
    .edit-contact-btn:hover { color: #a855f7; }

    /* Panel del Chat */
    .chat-area {
      width: 62%;
      display: flex;
      flex-direction: column;
      background-color: #121212;
    }
    .chat-header {
      padding: 15px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      word-wrap: break-word;
    }
    .message.sent {
      align-self: flex-end;
      background-color: #7e22ce;
      color: #fff;
    }
    .message.received {
      align-self: flex-start;
      background-color: #2a2a2a;
      color: #e0e0e0;
    }
    /* Formulario inferior */
    .input-area {
      padding: 15px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    .input-area input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background-color: #121212;
      color: #fff;
      outline: none;
    }
    .input-area input[type="text"] { flex: 1; }
    .input-area button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #a855f7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .input-area button:hover { background-color: #9333ea; }

    /* Modal simple para editar perfil */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #444;
    }
    .modal-content h3 { color: #fff; font-size: 16px; }
    .modal-content input {
      padding: 8px;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-buttons button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-save { background: #a855f7; color: #fff; }
    .btn-cancel { background: #444; color: #fff; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Panel Izquierdo: Tu Perfil y Contactos -->
    <div class="sidebar">
      <div class="profile-header">
        <div class="avatar-img" id="my-avatar-display">👤</div>
        <div class="profile-info">
          <h3 id="my-name-display">Mi Nombre</h3>
          <p id="my-number">Cargando...</p>
        </div>
        <button class="edit-profile-btn" onclick="openProfileModal()" title="Editar perfil">⚙️</button>
      </div>
      <div class="contacts-list" id="contacts-list">
        <!-- Lista dinámica de contactos -->
      </div>
    </div>

    <!-- Panel Derecho: Conversación -->
    <div class="chat-area">
      <div class="chat-header" id="chat-header">
        Selecciona o ingresa un número para chatear
      </div>
      <div class="messages-box" id="messages-box">
        <!-- Mensajes dinámicos -->
      </div>
      <div class="input-area">
        <input type="number" id="target-number" placeholder="Número destino..." style="width: 130px;">
        <input type="text" id="message-text" placeholder="Escribe un mensaje...">
        <button id="send-btn">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Perfil -->
  <div class="modal" id="profile-modal">
    <div class="modal-content">
      <h3>Editar Perfil</h3>
      <label style="font-size: 12px; color: #aaa;">Tu Nombre:</label>
      <input type="text" id="input-my-name" placeholder="Ej. Carlos Pérez">
      <label style="font-size: 12px; color: #aaa;">URL de tu Foto de Perfil (Opcional):</label>
      <input type="text" id="input-my-avatar" placeholder="https://ejemplo.com/foto.jpg">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeProfileModal()">Cancelar</button>
        <button class="btn-save" onclick="saveProfile()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURACIÓN DE IDENTIDAD Y PERFIL ---
    let myNumber = localStorage.getItem('my_virtual_number');
    if (!myNumber) {
      myNumber = Math.floor(100000 + Math.random() * 900000).toString();
      localStorage.setItem('my_virtual_number', myNumber);
    }

    let myName = localStorage.getItem('my_profile_name') || `Usuario ${myNumber}`;
    let myAvatar = localStorage.getItem('my_profile_avatar') || '';

    function updateProfileUI() {
      document.getElementById('my-number').textContent = `Nº ${myNumber}`;
      document.getElementById('my-name-display').textContent = myName;
      
      const avatarDisplay = document.getElementById('my-avatar-display');
      if (myAvatar) {
        avatarDisplay.innerHTML = `<img src="${myAvatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
      } else {
        avatarDisplay.innerHTML = '👤';
      }
    }
    updateProfileUI();

    // Inicializar PeerJS con el ID fijo guardado
    const peer = new Peer(myNumber);
    let activeConnections = {};
    let activeChatNumber = null;

    peer.on('open', (id) => {
      console.log('Conectado a PeerJS con número:', id);
    });

    // --- 2. GESTIÓN DE MODAL DE PERFIL ---
    function openProfileModal() {
      document.getElementById('input-my-name').value = myName;
      document.getElementById('input-my-avatar').value = myAvatar;
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    function saveProfile() {
      myName = document.getElementById('input-my-name').value.trim() || `Usuario ${myNumber}`;
      myAvatar = document.getElementById('input-my-avatar').value.trim();

      localStorage.setItem('my_profile_name', myName);
      localStorage.setItem('my_profile_avatar', myAvatar);

      updateProfileUI();
      closeProfileModal();
      
      // Opcional: Avisar a los contactos conectados que cambiaste tu perfil
      broadcastProfileUpdate();
    }

    function broadcastProfileUpdate() {
      const profileData = { type: 'PROFILE_UPDATE', name: myName, avatar: myAvatar };
      Object.values(activeConnections).forEach(conn => {
        if (conn.open) conn.send(profileData);
      });
    }

    // --- 3. MANEJO DE CONTACTOS Y LOCALSTORAGE ---
    function getContacts() {
      return JSON.parse(localStorage.getItem('chat_contacts')) || [];
    }

    function saveContactAuto(number, name = `Contacto ${number}`, avatar = '') {
      let contacts = getContacts();
      const index = contacts.findIndex(c => c.number === number);

      if (index === -1) {
        contacts.push({ number: number, name: name, avatar: avatar });
      } else {
        // Actualizar nombre o avatar si vienen datos nuevos
        if (name && name !== `Contacto ${number}`) contacts[index].name = name;
        if (avatar) contacts[index].avatar = avatar;
      }
      localStorage.setItem('chat_contacts', JSON.stringify(contacts));
      renderContactsList();
    }

    function editContactName(event, number) {
      event.stopPropagation();
      const currentName = getContacts().find(c => c.number === number)?.name || '';
      const newName = prompt("Nuevo nombre para el contacto:", currentName);
      if (newName && newName.trim()) {
        let contacts = getContacts();
        const contact = contacts.find(c => c.number === number);
        if (contact) {
          contact.name = newName.trim();
          localStorage.setItem('chat_contacts', JSON.stringify(contacts));
          renderContactsList();
          if (activeChatNumber === number) selectContact(number);
        }
      }
    }

    function getHistory(number) {
      const chats = JSON.parse(localStorage.getItem('chat_history')) || {};
      return chats[number] || [];
    }

    function saveMessageHistory(targetNumber, messageObj) {
      let chats = JSON.parse(localStorage.getItem('chat_history')) || {};
      if (!chats[targetNumber]) chats[targetNumber] = [];
      chats[targetNumber].push(messageObj);
      localStorage.setItem('chat_history', JSON.stringify(chats));
    }

    // --- 4. RENDERIZAR INTERFAZ ---
    function renderContactsList() {
      const listContainer = document.getElementById('contacts-list');
      listContainer.innerHTML = '';
      const contacts = getContacts();

      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = `contact-item ${activeChatNumber === c.number ? 'active' : ''}`;
        
        let avatarHTML = c.avatar ? `<img src="${c.avatar}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">` : `<div class="avatar-img" style="width:40px; height:40px; font-size:16px;">👤</div>`;

        item.innerHTML = `
          ${avatarHTML}
          <div class="contact-details">
            <div class="name">${c.name}</div>
            <div class="sub">Nº ${c.number}</div>
          </div>
          <button class="edit-contact-btn" onclick="editContactName(event, '${c.number}')" title="Editar nombre">✏️</button>
        `;
        item.onclick = () => selectContact(c.number);
        listContainer.appendChild(item);
      });
    }

    function selectContact(number) {
      activeChatNumber = number;
      document.getElementById('target-number').value = number;
      
      const contacts = getContacts();
      const contact = contacts.find(c => c.number === number);
      const displayName = contact ? contact.name : number;
      
      document.getElementById('chat-header').innerHTML = `Chat con ${displayName} (${number})`;
      renderContactsList();
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      if (!activeChatNumber) return;

      const history = getHistory(activeChatNumber);
      history.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.sender === 'me' ? 'sent' : 'received'}`;
        msgDiv.textContent = msg.text;
        box.appendChild(msgDiv);
      });
      box.scrollTop = box.scrollHeight;
    }

    // --- 5. RECEPCIÓN DE CONEXIONES Y MENSAJES ---
    peer.on('connection', (conn) => {
      const senderNumber = conn.peer;
      activeConnections[senderNumber] = conn;

      conn.on('data', (data) => {
        if (data.type === 'PROFILE_UPDATE') {
          // Actualizar datos del perfil del contacto remoto
          saveContactAuto(senderNumber, data.name, data.avatar);
          if (activeChatNumber === senderNumber) selectContact(senderNumber);
        } else {
          // Mensaje normal de chat
          saveContactAuto(senderNumber);
          saveMessageHistory(senderNumber, { sender: senderNumber, text: data.text });
          if (activeChatNumber === senderNumber) renderMessages();
        }
      });
    });

    // --- 6. ENVÍO DE MENSAJES ---
    document.getElementById('send-btn').onclick = () => {
      const targetInput = document.getElementById('target-number');
      const messageInput = document.getElementById('message-text');

      const targetNumber = targetInput.value.trim();
      const text = messageInput.value.trim();

      if (!targetNumber || !text) return;

      if (targetNumber === myNumber) {
        alert("No puedes enviarte mensajes a tu propio número.");
        return;
      }

      saveContactAuto(targetNumber);
      selectContact(targetNumber);

      const msgObj = { sender: 'me', text: text };
      saveMessageHistory(targetNumber, msgObj);
      renderMessages();

      messageInput.value = '';

      const payload = { type: 'MESSAGE', text: text, senderName: myName };

      if (activeConnections[targetNumber] && activeConnections[targetNumber].open) {
        activeConnections[targetNumber].send(payload);
      } else {
        const conn = peer.connect(targetNumber);
        activeConnections[targetNumber] = conn;

        conn.on('open', () => {
          // Enviar también el perfil actual al conectar por primera vez
          conn.send({ type: 'PROFILE_UPDATE', name: myName, avatar: myAvatar });
          conn.send(payload);
        });

        conn.on('error', (err) => {
          console.error("Error al enviar:", err);
          alert("No se pudo conectar con el usuario. Asegúrate de que esté en línea.");
        });
      }
    };

    renderContactsList();
  </script>
</body>
</html>
