<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PeerChat Pro</title>
  
  <!-- LOGO PARA EL ENLACE / FAVICON Y REDES -->
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/m5L87vX2/1977e3da90e44615439d8c0f8b5d4294-1.jpg">
  <link rel="apple-touch-icon" href="https://i.ibb.co/m5L87vX2/1977e3da90e44615439d8c0f8b5d4294-1.jpg">
  <meta property="og:image" content="https://i.ibb.co/m5L87vX2/1977e3da90e44615439d8c0f8b5d4294-1.jpg">

  <!-- Librería PeerJS para conectar 2 celulares -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161b22;
      --accent: #9d4edd;
      --accent-glow: #c77dff;
      --text: #ffffff;
      --bubble-me: #3c096c;
      --bubble-other: #21262d;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* LOGO DE LA APLICACIÓN */
    .app-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px auto;
      border: 3px solid var(--accent-glow);
      box-shadow: 0 0 15px rgba(199, 125, 255, 0.4);
    }

    /* PANTALLAS DE CONFIGURACIÓN Y LISTA DE CHATS */
    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 10;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-top: auto;
      margin-bottom: auto;
    }

    h2, h3 { color: var(--accent-glow); }

    input[type="text"] {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { opacity: 0.8; }

    /* AVATAR DE PERFIL */
    .avatar-upload {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--border);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      border: 2px dashed var(--accent-glow);
      position: relative;
    }

    .avatar-upload img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* LISTA DE CONTACTOS / CHATS GUARDADOS */
    .chats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 15px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .chat-item-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* ESTRUCTURA DEL CHAT ACTIVO */
    .chat-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    .chat-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: var(--bubble-me);
      border-bottom-right-radius: 2px;
    }

    .msg.other {
      align-self: flex-start;
      background: var(--bubble-other);
      border-bottom-left-radius: 2px;
    }

    .msg-sticker {
      background: transparent !important;
      padding: 0 !important;
    }

    .msg-sticker img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid var(--accent-glow);
    }

    /* BARRA INFERIOR DE MENSAJES (FIJA) */
    .chat-footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 65px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--accent-glow);
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MENÚ DESPLEGABLE DE COMPLEMENTOS (+) */
    .plus-panel {
      position: absolute;
      bottom: 70px;
      left: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 100;
      width: 220px;
    }

    .menu-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .menu-option:hover { background: rgba(255,255,255,0.05); }

    /* PANEL DE EMOJIS Y STICKERS GUARDADOS */
    .drawer-panel {
      position: absolute;
      bottom: 70px;
      left: 0; right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 90;
    }

    .emoji-item {
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px;
    }

    .sticker-thumb {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    /* MODAL DE PERFIL DEL CONTACTO */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 1. PANTALLA: CONFIGURACIÓN DE PERFIL INICIAL -->
    <div class="screen" id="profileScreen">
      <div class="card">
        <img src="https://i.ibb.co/m5L87vX2/1977e3da90e44615439d8c0f8b5d4294-1.jpg" alt="Logo" class="app-logo">
        <h2>Bienvenido a PeerChat</h2>
        <p style="font-size: 0.85rem; color: #8b949e;">Sube tu foto y nombre para empezar</p>
        
        <label class="avatar-upload" id="avatarPreviewLabel">
          <i data-lucide="camera" id="cameraIcon"></i>
          <img id="myAvatarImg" class="hidden">
          <input type="file" id="profilePicInput" accept="image/*" style="display: none;">
        </label>

        <input type="text" id="usernameInput" placeholder="Tu Nombre de usuario" maxlength="15">
        <button class="btn" id="btnSaveProfile"><i data-lucide="check"></i> Guardar e Iniciar</button>
      </div>
    </div>

    <!-- 2. PANTALLA: LISTA DE CHATS GUARDADOS -->
    <div class="screen hidden" id="chatsListScreen">
      <div class="chats-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img id="mainProfileAvatar" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
          <h3 id="mainProfileName">Mis Chats</h3>
        </div>
        <button class="btn" id="btnNewChat" style="padding: 8px 12px; font-size: 0.85rem;"><i data-lucide="plus"></i> Nuevo Chat</button>
      </div>

      <div id="chatsListContainer"></div>
    </div>

    <!-- 3. PANTALLA: GENERAR / INGRESAR CÓDIGO (NUEVA CONEXIÓN) -->
    <div class="screen hidden" id="connectScreen">
      <div class="card">
        <button class="icon-btn" id="btnBackToChats" style="align-self: flex-start;"><i data-lucide="arrow-left"></i> Volver</button>
        <h2>Conectar con otro Celular</h2>
        <button class="btn" id="btnGenCode"><i data-lucide="qr-code"></i> Generar Código</button>
        <hr style="border-color: var(--border);">
        <input type="text" id="joinCodeInput" placeholder="Código de 4 dígitos" maxlength="4">
        <button class="btn" id="btnJoin" style="background: var(--card-bg); border: 1px solid var(--border);"><i data-lucide="link"></i> Unirse</button>
      </div>
    </div>

    <!-- 4. PANTALLA: VISTA DEL CHAT ACTIVO -->
    <div class="chat-view hidden" id="chatView">
      <!-- HEADER -->
      <div class="chat-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="icon-btn" id="btnLeaveChat"><i data-lucide="arrow-left"></i></button>
          <div class="user-info" id="contactHeaderInfo">
            <img id="activeContactAvatar" class="chat-item-avatar">
            <div>
              <span id="activeContactName" style="font-weight: bold; font-size: 0.95rem;">Contacto</span>
              <p style="font-size: 0.75rem; color: #2ea043;">Conectado</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ÁREA DE MENSAJES -->
      <div class="chat-body" id="chatBody"></div>

      <!-- PANEL DE EMOJIS O STICKERS -->
      <div class="drawer-panel hidden" id="emojiDrawer"></div>
      <div class="drawer-panel hidden" id="stickerDrawer"></div>

      <!-- BARRA INFERIOR DE TEXTO/ENVIAR -->
      <div class="chat-footer">
        <button class="icon-btn" id="btnPlus"><i data-lucide="plus-circle" style="width: 28px; height: 28px;"></i></button>
        <input type="text" id="messageInput" style="flex: 1;" placeholder="Escribe un mensaje...">
        <button class="btn" id="btnSend" style="padding: 10px 14px;"><i data-lucide="send"></i></button>
      </div>

      <!-- MENÚ DE OPCIONES DEL BÓTON "+" -->
      <div class="plus-panel hidden" id="plusPanel">
        <label class="menu-option">
          <i data-lucide="image"></i> Subir Foto/Sticker
          <input type="file" id="stickerInput" accept="image/*" style="display: none;">
        </label>
        <div class="menu-option" id="btnToggleEmojis"><i data-lucide="smile"></i> Emojis</div>
        <div class="menu-option" id="btnToggleStickers"><i data-lucide="sticker"></i> Stickers Guardados</div>
      </div>
    </div>

    <!-- MODAL PERFIL/OPCIONES CONTACTO -->
    <div class="modal hidden" id="contactModal">
      <div class="card" style="max-width: 300px;">
        <img id="modalContactAvatar" style="width: 70px; height: 70px; border-radius: 50%; margin: 0 auto; object-fit: cover;">
        <h3 id="modalContactName">Contacto</h3>
        <button class="btn" style="background: #21262d; border: 1px solid var(--border);" id="btnClearChatHistory"><i data-lucide="trash-2"></i> Borrar Chat</button>
        <button class="btn" style="background: #da3633;" id="btnBlockContact"><i data-lucide="shield-alert"></i> Bloquear / Eliminar</button>
        <button class="btn" style="background: transparent;" id="btnCloseModal">Cerrar</button>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // SINTETIZADOR DE SONIDO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(type === 'send' ? 500 : 700, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // ESTADO DE LA APLICACIÓN
    let myProfile = JSON.parse(localStorage.getItem('user_profile') || '{"name":"","avatar":""}');
    let savedContacts = JSON.parse(localStorage.getItem('saved_contacts') || '{}');
    let savedStickers = JSON.parse(localStorage.getItem('saved_stickers') || '[]');
    let peer = null;
    let conn = null;
    let currentChatId = null;

    // VISTAS
    const profileScreen = document.getElementById('profileScreen');
    const chatsListScreen = document.getElementById('chatsListScreen');
    const connectScreen = document.getElementById('connectScreen');
    const chatView = document.getElementById('chatView');
    const chatBody = document.getElementById('chatBody');

    // INICIALIZACIÓN DE PANTALLAS
    if (myProfile.name && myProfile.avatar) {
      showChatsList();
    } else {
      profileScreen.classList.remove('hidden');
    }

    // MANEJO DE FOTO DE PERFIL
    document.getElementById('profilePicInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          myProfile.avatar = event.target.result;
          document.getElementById('myAvatarImg').src = myProfile.avatar;
          document.getElementById('myAvatarImg').classList.remove('hidden');
          document.getElementById('cameraIcon').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btnSaveProfile').addEventListener('click', () => {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name || !myProfile.avatar) return alert('Sube tu foto y nombre de usuario');
      myProfile.name = name;
      localStorage.setItem('user_profile', JSON.stringify(myProfile));
      profileScreen.classList.add('hidden');
      showChatsList();
    });

    function showChatsList() {
      document.getElementById('mainProfileName').innerText = myProfile.name;
      document.getElementById('mainProfileAvatar').src = myProfile.avatar;
      chatsListScreen.classList.remove('hidden');
      renderContactsList();
    }

    function renderContactsList() {
      const container = document.getElementById('chatsListContainer');
      container.innerHTML = '';
      const keys = Object.keys(savedContacts);
      if (keys.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#8b949e; margin-top:20px;">No tienes chats guardados. Toca "+ Nuevo Chat"</p>';
        return;
      }

      keys.forEach(id => {
        const c = savedContacts[id];
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.innerHTML = `
          <img src="${c.avatar}" class="chat-item-avatar">
          <div style="flex:1;">
            <div style="font-weight:bold;">${c.name}</div>
            <div style="font-size:0.8rem; color:#8b949e;">Toca para abrir chat</div>
          </div>
        `;
        item.onclick = () => openChat(id, c.name, c.avatar);
        container.appendChild(item);
      });
    }

    document.getElementById('btnNewChat').addEventListener('click', () => {
      chatsListScreen.classList.add('hidden');
      connectScreen.classList.remove('hidden');
    });

    document.getElementById('btnBackToChats').addEventListener('click', () => {
      connectScreen.classList.add('hidden');
      chatsListScreen.classList.remove('hidden');
    });

    // PEERJS / CONEXIONES
    document.getElementById('btnGenCode').addEventListener('click', () => {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      setupPeer(`peer-room-${code}`, code);
    });

    document.getElementById('btnJoin').addEventListener('click', () => {
      const code = document.getElementById('joinCodeInput').value.trim();
      if (code.length === 4) setupPeer(null, code);
    });

    function setupPeer(customId, code) {
      peer = new Peer(customId);
      peer.on('open', () => {
        if (customId) {
          alert(`Código de sala: ${code}. Compártelo con la otra persona.`);
        } else {
          conn = peer.connect(`peer-room-${code}`);
          bindConnEvents();
        }
      });
      peer.on('connection', (c) => {
        conn = c;
        bindConnEvents();
      });
    }

    function bindConnEvents() {
      conn.on('open', () => {
        conn.send({ type: 'HANDSHAKE', profile: myProfile });
      });

      conn.on('data', (data) => {
        if (data.type === 'HANDSHAKE') {
          const contactId = conn.peer;
          savedContacts[contactId] = { name: data.profile.name, avatar: data.profile.avatar, messages: savedContacts[contactId]?.messages || [] };
          localStorage.setItem('saved_contacts', JSON.stringify(savedContacts));
          connectScreen.classList.add('hidden');
          openChat(contactId, data.profile.name, data.profile.avatar);
        }

        if (data.type === 'TEXT') {
          appendMessage(data.text, 'other');
          saveMessageToHistory(currentChatId, data.text, 'other');
          playSound('receive');
        }

        if (data.type === 'STICKER') {
          appendSticker(data.imgSrc, 'other');
          saveMessageToHistory(currentChatId, data.imgSrc, 'other', true);
          playSound('receive');
        }
      });
    }

    function openChat(id, name, avatar) {
      currentChatId = id;
      document.getElementById('activeContactName').innerText = name;
      document.getElementById('activeContactAvatar').src = avatar;
      chatsListScreen.classList.add('hidden');
      chatView.classList.remove('hidden');

      // Cargar historial
      chatBody.innerHTML = '';
      const history = savedContacts[id]?.messages || [];
      history.forEach(m => {
        if (m.isSticker) appendSticker(m.content, m.sender);
        else appendMessage(m.content, m.sender);
      });
    }

    document.getElementById('btnLeaveChat').addEventListener('click', () => {
      chatView.classList.add('hidden');
      showChatsList();
    });

    // ENVIAR TEXTO
    document.getElementById('btnSend').addEventListener('click', sendText);
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendText(); });

    function sendText() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      if (conn && conn.open) {
        conn.send({ type: 'TEXT', text });
      }

      appendMessage(text, 'me');
      saveMessageToHistory(currentChatId, text, 'me');
      input.value = '';
      playSound('send');
    }

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      chatBody.appendChild(msg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // ENVIAR Y GUARDAR STICKERS / COMPLEMENTOS
    document.getElementById('btnPlus').addEventListener('click', () => {
      document.getElementById('plusPanel').classList.toggle('hidden');
      document.getElementById('emojiDrawer').classList.add('hidden');
      document.getElementById('stickerDrawer').classList.add('hidden');
    });

    document.getElementById('stickerInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const imgSrc = event.target.result;
          if (conn && conn.open) conn.send({ type: 'STICKER', imgSrc });
          appendSticker(imgSrc, 'me');
          saveMessageToHistory(currentChatId, imgSrc, 'me', true);
          playSound('send');
          document.getElementById('plusPanel').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    function appendSticker(src, sender) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender} msg-sticker`;

      const img = document.createElement('img');
      img.src = src;

      const btnSave = document.createElement('button');
      btnSave.style.cssText = "display:block; font-size:0.7rem; background:rgba(255,255,255,0.1); color:#fff; border:none; padding:4px; border-radius:6px; margin-top:4px; cursor:pointer;";
      btnSave.innerText = "💾 Guardar Sticker";
      btnSave.onclick = () => {
        if(!savedStickers.includes(src)) {
          savedStickers.push(src);
          localStorage.setItem('saved_stickers', JSON.stringify(savedStickers));
          alert('Sticker Guardado');
        }
      };

      msg.appendChild(img);
      msg.appendChild(btnSave);
      chatBody.appendChild(msg);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // EMOJIS Y STICKERS GUARDADOS
    document.getElementById('btnToggleEmojis').addEventListener('click', () => {
      const drawer = document.getElementById('emojiDrawer');
      drawer.innerHTML = '';
      ['😀','😂','🔥','❤️','👍','🎉','😎','💩','👑','⚡'].forEach(emoji => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.innerText = emoji;
        span.onclick = () => {
          document.getElementById('messageInput').value += emoji;
        };
        drawer.appendChild(span);
      });
      drawer.classList.remove('hidden');
      document.getElementById('plusPanel').classList.add('hidden');
    });

    document.getElementById('btnToggleStickers').addEventListener('click', () => {
      const drawer = document.getElementById('stickerDrawer');
      drawer.innerHTML = '';
      if(savedStickers.length === 0) drawer.innerHTML = '<p style="font-size:0.8rem; color:#8b949e;">No tienes stickers guardados</p>';
      savedStickers.forEach(src => {
        const img = document.createElement('img');
        img.className = 'sticker-thumb';
        img.src = src;
        img.onclick = () => {
          if (conn && conn.open) conn.send({ type: 'STICKER', imgSrc: src });
          appendSticker(src, 'me');
          saveMessageToHistory(currentChatId, src, 'me', true);
          playSound('send');
        };
        drawer.appendChild(img);
      });
      drawer.classList.remove('hidden');
      document.getElementById('plusPanel').classList.add('hidden');
    });

    function saveMessageToHistory(contactId, content, sender, isSticker = false) {
      if (!savedContacts[contactId]) return;
      savedContacts[contactId].messages.push({ content, sender, isSticker });
      localStorage.setItem('saved_contacts', JSON.stringify(savedContacts));
    }

    // OPCIONES DEL CONTACTO
    document.getElementById('contactHeaderInfo').addEventListener('click', () => {
      document.getElementById('modalContactName').innerText = savedContacts[currentChatId].name;
      document.getElementById('modalContactAvatar').src = savedContacts[currentChatId].avatar;
      document.getElementById('contactModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('contactModal').classList.add('hidden');
    });

    document.getElementById('btnClearChatHistory').addEventListener('click', () => {
      savedContacts[currentChatId].messages = [];
      localStorage.setItem('saved_contacts', JSON.stringify(savedContacts));
      chatBody.innerHTML = '';
      document.getElementById('contactModal').classList.add('hidden');
    });

    document.getElementById('btnBlockContact').addEventListener('click', () => {
      delete savedContacts[currentChatId];
      localStorage.setItem('saved_contacts', JSON.stringify(savedContacts));
      document.getElementById('contactModal').classList.add('hidden');
      chatView.classList.add('hidden');
      showChatsList();
    });
  </script>
</body>
</html>
